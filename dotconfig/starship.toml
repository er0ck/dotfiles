"$schema" = 'https://starship.rs/config-schema.json'

palette = 'solarized_dark'

[palettes.solarized_dark]
base03  = '#002b36'
base02  = '#073642'
base01  = '#586e75'
base00  = '#657b83'
base0   = '#839496'
base1   = '#93a1a1'
base2   = '#eee8d5'
base3   = '#fdf6e3'
yellow  = '#b58900'
orange  = '#cb4b16'
red     = '#dc322f'
magenta = '#d33682'
violet  = '#6c71c4'
blue    = '#268bd2'
cyan    = '#2aa198'
green   = '#859900'

format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$java\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = 'fg:base01'

[os.symbols]
Macos = ''

[directory]
style = 'bold fg:blue'
truncation_length = 4
truncate_to_repo = true
read_only = ' '

[git_branch]
symbol = ' '
style = 'fg:cyan'
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'fg:yellow'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '!'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?'
stashed = '$'
modified = '~'
staged = '+'
renamed = '»'
deleted = '✘'

[nodejs]
symbol = ' '
style = 'fg:green'
format = '[$symbol$version ]($style)'

[python]
symbol = ' '
style = 'fg:yellow'
format = '[${symbol}${pyenv_prefix}${version} ]($style)'

[golang]
symbol = ' '
style = 'fg:cyan'
format = '[$symbol$version ]($style)'

[rust]
symbol = ' '
style = 'fg:orange'
format = '[$symbol$version ]($style)'

[java]
symbol = ' '
style = 'fg:red'
format = '[$symbol$version ]($style)'

[cmd_duration]
min_time = 2_000
style = 'fg:base01'
format = '[ $duration]($style)'

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol   = '[❯](bold fg:red)'
vimcmd_symbol  = '[❮](bold fg:yellow)'
